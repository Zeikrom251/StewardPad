# Publishing a GitHub release builds the Windows installer and attaches it to that release.
# The release tag must match the app version: v0.2.0 for "version": "0.2.0" in tauri.conf.json.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match the app version v$version (tauri.conf.json)."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm --filter @stewardpad/shared build
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update package so installed apps can trust it (see the desktop updater).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ github.event.release.id }}
          updaterJsonPreferNsis: true
