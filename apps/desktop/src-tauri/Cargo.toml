[package]
name = "stewardpad-desktop"
version = "0.1.0-alpha.2"
description = "StewardPad — race control for Le Mans Ultimate stewards"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "stewardpad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
# Native Save / folder dialogs for CSV exports and the archive folder.
tauri-plugin-dialog = "=2.8.0"
# In-app updates: checks the latest GitHub release, verifies its signature, runs the installer.
tauri-plugin-updater = "=2.13.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Incident ids — random v4, same as crypto.randomUUID() in the NestJS server.
uuid = { version = "=1.26.1", features = ["v4"] }
# HTTP: LMU REST polling over plain http://localhost, and the StewardPad API over TLS (rustls)
# with gzip — the default features.
ureq = "=3.4.2"
# Gzips the live timing frames a streaming PC uploads (~33 kB of JSON becomes ~4 kB).
flate2 = "=1.1.10"
# PKCE (RFC 7636) for the desktop sign-in: SHA-256 of the verifier, base64url-encoded.
sha2 = "=0.10.9"
base64 = "=0.22.1"
# The API token lives in the OS credential store (Windows Credential Manager), never in a file.
keyring-core = "=1.0.0"
# stewardpad:// links from the website (sign-in, invites): registered by the installer,
# forwarded to the running window by the single-instance plugin.
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "=1.1.0"

# Development under WSL: the kernel keyring stands in for Credential Manager.
[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "=1.0.0"
